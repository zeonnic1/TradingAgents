services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - tradingagents-public

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=tradingagents_crypto
      - MYSQL_USER=tradingagents
      - MYSQL_PASSWORD=tradingagents
      - MYSQL_ROOT_PASSWORD=tradingagents_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tradingagents-public

networks:
  tradingagents-public:
    name: tradingagents-public

volumes:
  mysql_data:
